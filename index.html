<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RutaCash - Lista de Clientes</title>
  <style>
    * { box-sizing: border-box; font-family: sans-serif; margin: 0; padding: 0; }
    body { background-color: #f2f2f2; -webkit-user-select: none; user-select: none; }

    /* Encabezado Azul */
    .top-header {
      background-color: #3b5998;
      color: white;
      padding: 10px 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .top-header h2 { font-size: 18px; font-weight: normal; }
    .top-header .stats { font-size: 13px; opacity: 0.9; text-align: right; }

    /* Barra de Búsqueda */
    .search-bar {
      background-color: #ffffff;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 2px solid #e0e0e0;
    }
    .search-bar input {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 16px;
      outline: none;
    }

    /* Contenedor de Lista */
    .client-list { padding-bottom: 70px; }

    /* Tarjeta de Cliente */
    .client-card {
      background-color: white;
      padding: 12px 15px;
      display: flex;
      align-items: center;
      border-bottom: 1px solid #e0e0e0;
    }
    .client-card:active { background-color: #e9ecef; }

    /* Icono indicador */
    .icon-status {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: white;
      margin-right: 12px;
      font-size: 14px;
      flex-shrink: 0;
    }
    .status-red { background-color: #e74c3c; }   /* Pendiente hoy */
    .status-green { background-color: #2ecc71; } /* Pagado hoy */
    .status-grey { background-color: #95a5a6; }  /* Saldo $0 */

    /* Información */
    .client-info { flex: 1; }
    .client-info .name {
      font-size: 15px;
      font-weight: bold;
      color: #333;
      margin-bottom: 4px;
      text-transform: uppercase;
    }
    .client-info .details {
      font-size: 13px;
      color: #555;
    }
    .client-info .details span { font-weight: bold; color: #000; }

    /* Botón Cobrar */
    .btn-action {
      background-color: #27ae60;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
    }

    /* Modal Formulario */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }
    .modal-card {
      background: white;
      padding: 20px;
      border-radius: 8px;
      width: 90%;
      max-width: 400px;
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-card h3 { margin-bottom: 12px; color: #3b5998; }
    .form-group { margin-bottom: 10px; }
    .form-group label { display: block; font-size: 12px; font-weight: bold; color: #555; margin-bottom: 3px; }
    .form-group input, .form-group select {
      width: 100%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
    }
    
    /* Resumen Calculado */
    .calc-box {
      background-color: #eef2f7;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 12px;
      border-left: 4px solid #3b5998;
      font-size: 13px;
    }
    .calc-box div { margin-bottom: 3px; }
    .calc-box b { color: #2c3e50; }

    .btn-main { background: #27ae60; color: white; border: none; padding: 12px; border-radius: 4px; width: 100%; font-weight: bold; font-size: 15px; margin-bottom: 8px; cursor: pointer; }
    .btn-close { background: #95a5a6; color: white; border: none; padding: 10px; border-radius: 4px; width: 100%; font-weight: bold; cursor: pointer; }

    /* Navegación Inferior */
    .bottom-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 55px;
      background-color: #ffffff;
      border-top: 1px solid #ccc;
      display: flex;
      justify-content: space-around;
      align-items: center;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      color: #666;
      background: none;
      border: none;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }
    .nav-item.active { background-color: #f1c40f; color: #000; font-weight: bold; }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="top-header">
    <h2>::RutaCash:: Lista de Clientes</h2>
    <div class="stats">
      Cobrado Hoy: <b id="totalCobrado">$0.00</b><br>
      <span id="fechaHoy"></span>
    </div>
  </div>

  <!-- Buscador -->
  <div class="search-bar">
    <input type="text" id="inputBuscar" placeholder="Buscar Cliente..." onkeyup="filtrarClientes()">
  </div>

  <!-- Lista de Clientes -->
  <div class="client-list" id="contenedorLista">
    <div style="text-align:center; padding: 30px; color:#777;">Cargando clientes...</div>
  </div>

  <!-- Menú Inferior -->
  <div class="bottom-nav">
    <button class="nav-item active">📋 Clientes</button>
    <button class="nav-item" onclick="abrirModal()">➕ Nuevo</button>
  </div>

  <!-- Modal Nuevo Cliente -->
  <div class="modal" id="modalNuevo">
    <div class="modal-card">
      <h3>➕ Nuevo Préstamo</h3>
      
      <div class="form-group">
        <label>Nombre del Cliente</label>
        <input type="text" id="nombre" placeholder="Ej: JUAN PEREZ">
      </div>

      <div class="form-group">
        <label>Teléfono (WhatsApp)</label>
        <input type="tel" id="telefono" placeholder="Ej: 5491122334455">
      </div>

      <div class="form-group">
        <label>Monto Prestado / Capital ($)</label>
        <input type="number" id="montoCapital" placeholder="Ej: 1000" oninput="calcularPrestamo()">
      </div>

      <div class="form-group">
        <label>Porcentaje de Interés</label>
        <select id="interes" onchange="calcularPrestamo()">
          <option value="10">10%</option>
          <option value="15">15%</option>
          <option value="20" selected>20%</option>
          <option value="25">25%</option>
          <option value="30">30%</option>
        </select>
      </div>

      <div class="form-group">
        <label>Modalidad de Pago</label>
        <select id="modalidad" onchange="calcularPrestamo()">
          <option value="Diario" selected>Diario</option>
          <option value="Semanal">Semanal</option>
        </select>
      </div>

      <div class="form-group">
        <label>Plazo (Número de cuotas)</label>
        <select id="plazo" onchange="calcularPrestamo()">
          <!-- Generado por JS del 1 al 60 -->
        </select>
      </div>

      <!-- Resumen Calculado -->
      <div class="calc-box">
        <div>Total a Pagar: <b id="calcTotal">$0.00</b></div>
        <div>Valor por Cuota: <b id="calcCuota">$0.00</b></div>
      </div>

      <button class="btn-main" onclick="guardarCliente()">Guardar Préstamo</button>
      <button class="btn-close" onclick="cerrarModal()">Cancelar</button>
    </div>
  </div>

  <!-- Firebase Integration -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, updateDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCI-s09x6xqiJ3LNoralDmX9GuNtTuSK5k",
      authDomain: "rutacash-44a4a.firebaseapp.com",
      projectId: "rutacash-44a4a",
      storageBucket: "rutacash-44a4a.firebasestorage.app",
      messagingSenderId: "509573274669",
      appId: "1:509573274669:web:3766c2e5e08962ebe8aca4",
      measurementId: "G-KKX2RTKF1M"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const todayStr = new Date().toISOString().split('T')[0];
    document.getElementById('fechaHoy').innerText = todayStr;

    let todosLosClientes = [];

    // Poblar Selector de Plazos (1 a 60)
    const selectPlazo = document.getElementById('plazo');
    for (let i = 1; i <= 60; i++) {
      const opt = document.createElement('option');
      opt.value = i;
      opt.innerText = `${i} ${i === 1 ? 'cuota' : 'cuotas'}`;
      if (i === 24) opt.selected = true; // Valor por defecto 24 cuotas
      selectPlazo.appendChild(opt);
    }

    window.abrirModal = () => document.getElementById('modalNuevo').style.display = 'flex';
    window.cerrarModal = () => document.getElementById('modalNuevo').style.display = 'none';

    // Función de cálculo automático
    window.calcularPrestamo = () => {
      const capital = parseFloat(document.getElementById('montoCapital').value) || 0;
      const pctInteres = parseFloat(document.getElementById('interes').value) || 0;
      const numCuotas = parseInt(document.getElementById('plazo').value) || 1;

      const totalPagar = capital + (capital * (pctInteres / 100));
      const valorCuota = totalPagar / numCuotas;

      document.getElementById('calcTotal').innerText = `$${totalPagar.toFixed(2)}`;
      document.getElementById('calcCuota').innerText = `$${valorCuota.toFixed(2)}`;
    };

    // Guardar Cliente
    window.guardarCliente = async () => {
      const nombre = document.getElementById('nombre').value;
      const telefono = document.getElementById('telefono').value;
      const capital = parseFloat(document.getElementById('montoCapital').value) || 0;
      const pctInteres = parseFloat(document.getElementById('interes').value) || 0;
      const modalidad = document.getElementById('modalidad').value;
      const plazo = parseInt(document.getElementById('plazo').value) || 1;

      if (!nombre || capital <= 0) return alert("Ingresa un nombre y monto válido.");

      const montoTotal = capital + (capital * (pctInteres / 100));
      const cuota = montoTotal / plazo;

      await addDoc(collection(db, "prestamos"), {
        nombre,
        telefono,
        capital,
        pctInteres,
        montoTotal,
        cuota,
        modalidad,
        plazo,
        saldoPendiente: montoTotal,
        ultimoPagoFecha: ""
      });

      cerrarModal();
      location.reload();
    };

    // Cargar Lista
    async function cargarClientes() {
      const querySnapshot = await getDocs(collection(db, "prestamos"));
      todosLosClientes = [];
      let totalCobrado = 0;

      querySnapshot.forEach((docSnap) => {
        const data = docSnap.data();
        data.id = docSnap.id;
        todosLosClientes.push(data);
        if (data.ultimoPagoFecha === todayStr) {
          totalCobrado += data.cuota;
        }
      });

      document.getElementById('totalCobrado').innerText = `$${totalCobrado.toFixed(2)}`;
      renderizarLista(todosLosClientes);
    }

    // Renderizar Lista
    function renderizarLista(lista) {
      const contenedor = document.getElementById('contenedorLista');
      contenedor.innerHTML = '';

      if (lista.length === 0) {
        contenedor.innerHTML = `<div style="text-align:center; padding: 20px; color:#888;">No hay clientes registrados</div>`;
        return;
      }

      lista.forEach((c, index) => {
        const realizoPagoHoy = c.ultimoPagoFecha === todayStr;
        
        let statusClass = 'status-red';
        let statusIcon = '👤';

        if (c.saldoPendiente <= 0) {
          statusClass = 'status-grey';
          statusIcon = '✓';
        } else if (realizoPagoHoy) {
          statusClass = 'status-green';
          statusIcon = '✓';
        }

        const div = document.createElement('div');
        div.className = 'client-card';
        div.innerHTML = `
          <div class="icon-status ${statusClass}">${statusIcon}</div>
          <div class="client-info">
            <div class="name">${index + 1}. ${c.nombre}</div>
            <div class="details">
              Cuota (${c.modalidad || 'Diaria'}): <span>$${c.cuota.toFixed(2)}</span><br>
              Saldo: <span>$${c.saldoPendiente.toFixed(2)}</span> / $${(c.montoTotal || c.montoPrestado).toFixed(2)}
            </div>
          </div>
          ${!realizoPagoHoy && c.saldoPendiente > 0 ? 
            `<button class="btn-action" onclick="cobrar('${c.id}', ${c.saldoPendiente}, ${c.cuota})">Cobrar</button>` : 
            `<span style="font-size:12px; color:#27ae60; font-weight:bold;">${c.saldoPendiente <= 0 ? 'Saldado' : 'Pagado'}</span>`}
        `;
        contenedor.appendChild(div);
      });
    }

    // Buscador
    window.filtrarClientes = () => {
      const texto = document.getElementById('inputBuscar').value.toLowerCase();
      const filtrados = todosLosClientes.filter(c => c.nombre.toLowerCase().includes(texto));
      renderizarLista(filtrados);
    };

    // Cobrar
    window.cobrar = async (id, saldoActual, cuota) => {
      const nuevoSaldo = Math.max(0, saldoActual - cuota);
      await updateDoc(doc(db, "prestamos", id), {
        saldoPendiente: nuevoSaldo,
        ultimoPagoFecha: todayStr
      });
      location.reload();
    };

    cargarClientes();
  </script>
</body>
</html>
