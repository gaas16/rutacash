<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RutaCash - Control de Ingresos y Egresos</title>
  <style>
    :root {
      --primary: #2c3e50;
      --secondary: #27ae60;
      --danger: #e74c3c;
      --bg: #f4f6f7;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg);
      margin: 0;
      padding: 20px;
      color: #333;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: #fff;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    h1, h2 {
      text-align: center;
      color: var(--primary);
    }
    .grid-form {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 20px;
    }
    input, select, button {
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 14px;
    }
    button.btn-add {
      background-color: var(--secondary);
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }
    button.btn-add:hover {
      background-color: #219150;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    th, td {
      padding: 12px;
      border-bottom: 1px solid #ddd;
      text-align: left;
    }
    th {
      background-color: var(--primary);
      color: white;
    }
    .btn-delete {
      background-color: var(--danger);
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
    }
    .btn-delete:hover {
      background-color: #c0392b;
    }
    /* Estilos del Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal-content {
      background: white;
      padding: 25px;
      border-radius: 8px;
      width: 100%;
      max-width: 350px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }
    .modal-actions {
      display: flex;
      justify-content: space-between;
      margin-top: 15px;
    }
    .btn-cancel {
      background-color: #7f8c8d;
      color: white;
      border: none;
      cursor: pointer;
    }
    .error-msg {
      color: var(--danger);
      font-size: 13px;
      margin-top: 8px;
      display: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>RutaCash</h1>

    <!-- Formulario para Registrar Movimientos -->
    <h2>Nuevo Registro</h2>
    <form id="formMovimiento" class="grid-form">
      <input type="text" id="concepto" placeholder="Concepto / Descripción" required>
      <input type="number" id="monto" placeholder="Monto" step="0.01" required>
      <select id="tipo">
        <option value="ingreso">Ingreso</option>
        <option value="egreso">Egreso</option>
      </select>
      <button type="submit" class="btn-add">Guardar Registro</button>
    </form>

    <!-- Tabla de Registros -->
    <h2>Historial de Movimientos</h2>
    <table>
      <thead>
        <tr>
          <th>Concepto</th>
          <th>Tipo</th>
          <th>Monto</th>
          <th>Acción</th>
        </tr>
      </thead>
      <tbody id="tablaCuerpo">
        <!-- Se llena dinámicamente -->
      </tbody>
    </table>
  </div>

  <!-- Modal de Validación de Contraseña de Administrador -->
  <div class="modal-overlay" id="modalAdmin">
    <div class="modal-content">
      <h3>Acceso Restringido</h3>
      <p>Ingresa la contraseña de administrador para eliminar este registro:</p>
      <input type="password" id="adminPassInput" placeholder="Contraseña de Admin" style="width: 100%; box-sizing: border-box;">
      <div id="errorPass" class="error-msg">Contraseña incorrecta</div>
      
      <div class="modal-actions">
        <button class="btn-cancel" onclick="cerrarModalAdmin()">Cancelar</button>
        <button class="btn-delete" onclick="validarYBorrar()">Confirmar Borrado</button>
      </div>
    </div>
  </div>

  <script>
    // Configuración Inicial y Estado
    const ADMIN_PASSWORD_CORRECTA = "admin123"; // Cambia esta contraseña por la que desees
    let movimientos = JSON.parse(localStorage.getItem('rutacash_movimientos')) || [];
    let registroPendienteBorrado = null;

    const form = document.getElementById('formMovimiento');
    const tablaCuerpo = document.getElementById('tablaCuerpo');
    const modalAdmin = document.getElementById('modalAdmin');
    const adminPassInput = document.getElementById('adminPassInput');
    const errorPass = document.getElementById('errorPass');

    // Escuchar el envío del formulario
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const nuevoMovimiento = {
        id: Date.now(),
        concepto: document.getElementById('concepto').value,
        monto: parseFloat(document.getElementById('monto').value),
        tipo: document.getElementById('tipo').value
      };
      
      movimientos.push(nuevoMovimiento);
      guardarYRenderizar();
      form.reset();
    });

    // Renderizar la tabla de movimientos
    function renderizarTabla() {
      tablaCuerpo.innerHTML = '';
      movimientos.forEach((item) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${item.concepto}</td>
          <td style="color: ${item.tipo === 'ingreso' ? 'green' : 'red'}; font-weight: bold;">
            ${item.tipo.toUpperCase()}
          </td>
          <td>$${item.monto.toFixed(2)}</td>
          <td>
            <button class="btn-delete" onclick="solicitarPermisoBorrado(${item.id})">Eliminar</button>
          </td>
        `;
        tablaCuerpo.appendChild(tr);
      });
    }

    // Intercepta la acción de borrado y abre el modal
    function solicitarPermisoBorrado(id) {
      registroPendienteBorrado = id;
      adminPassInput.value = '';
      errorPass.style.display = 'none';
      modalAdmin.style.display = 'flex';
      adminPassInput.focus();
    }

    // Cierra el modal de confirmación
    function cerrarModalAdmin() {
      modalAdmin.style.display = 'none';
      registroPendienteBorrado = null;
    }

    // Valida la clave de administrador ingresada
    function validarYBorrar() {
      const pass = adminPassInput.value;
      if (pass === ADMIN_PASSWORD_CORRECTA) {
        ejecutarBorrado(registroPendienteBorrado);
        cerrarModalAdmin();
      } else {
        errorPass.style.display = 'block';
      }
    }

    // Elimina el registro del estado y actualiza el almacenamiento
    function ejecutarBorrado(id) {
      movimientos = movimientos.filter(item => item.id !== id);
      guardarYRenderizar();
    }

    // Guarda en LocalStorage y refresca la interfaz
    function guardarYRenderizar() {
      localStorage.setItem('rutacash_movimientos', JSON.stringify(movimientos));
      renderizarTabla();
    }

    // Cargar datos al iniciar
    renderizarTabla();
  </script>
</body>
</html>
