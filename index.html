<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Cobranza Diaria</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body, html { margin: 0; padding: 0; height: 100%; font-family: sans-serif; }
    #map { height: 100vh; width: 100%; }

    /* Barra Superior de Resumen */
    .top-bar {
      position: absolute; top: 10px; left: 10px; right: 10px; z-index: 1000;
      background: rgba(255, 255, 255, 0.95); padding: 12px; border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15); display: flex; justify-content: space-between; font-weight: bold;
    }

    /* Modales */
    .modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5); z-index: 2000; justify-content: center; align-items: center;
    }
    .modal-card { background: white; padding: 20px; border-radius: 10px; width: 300px; }
    .modal-card input { width: 100%; margin-bottom: 10px; padding: 8px; box-sizing: border-box; }
    .btn { padding: 8px 12px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 5px; }
    .btn-green { background: #27ae60; color: white; }
    .btn-gray { background: #95a5a6; color: white; }
  </style>
</head>
<body>

  <!-- Barra de Control -->
  <div class="top-bar">
    <div>Cobrado Hoy: <span id="totalCobrado" style="color:#27ae60;">$0</span></div>
    <div>Fecha: <span id="fechaHoy"></span></div>
  </div>

  <div id="map"></div>

  <!-- Modal para Crear Préstamo -->
  <div class="modal" id="modalNuevoCliente">
    <div class="modal-card">
      <h3>➕ Nuevo Préstamo</h3>
      <input type="text" id="nombre" placeholder="Nombre del Cliente">
      <input type="tel" id="telefono" placeholder="Teléfono (WhatsApp)">
      <input type="number" id="montoPrestado" placeholder="Monto Total a Pagar ($)">
      <input type="number" id="cuotaDiaria" placeholder="Cuota Diaria ($)">
      <button class="btn btn-green" onclick="guardarCliente()">Guardar Cliente</button>
      <button class="btn btn-gray" onclick="cerrarModal()">Cancelar</button>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Firebase SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, updateDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

   // Configuración Firebase (RutaCash)
const firebaseConfig = {
  apiKey: "AIzaSyCI-s09x6xqiJ3LNoralDmX9GuNtTuSK5k",
  authDomain: "rutacash-44a4a.firebaseapp.com",
  projectId: "rutacash-44a4a",
  storageBucket: "rutacash-44a4a.firebasestorage.app",
  messagingSenderId: "509573274669",
  appId: "1:509573274669:web:3766c2e5e08962ebe8aca4",
  measurementId: "G-KKX2RTKF1M"
};

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let map, coordTemp;
    const todayStr = new Date().toISOString().split('T')[0];
    document.getElementById('fechaHoy').innerText = todayStr;

    // Inicializar Mapa
    map = L.map('map', { doubleClickZoom: false }).setView([-29.9189, -51.1781], 13);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png').addTo(map);

    // Doble clic para agregar punto
    map.on('dblclick', (e) => {
      coordTemp = e.latlng;
      document.getElementById('modalNuevoCliente').style.display = 'flex';
    });

    window.cerrarModal = () => { document.getElementById('modalNuevoCliente').style.display = 'none'; };

    // Guardar nuevo préstamo
    window.guardarCliente = async () => {
      const nombre = document.getElementById('nombre').value;
      const telefono = document.getElementById('telefono').value;
      const montoTotal = parseFloat(document.getElementById('montoPrestado').value) || 0;
      const cuota = parseFloat(document.getElementById('cuotaDiaria').value) || 0;

      if (!nombre || montoTotal <= 0) return alert("Ingresa datos válidos");

      const cliente = {
        nombre, telefono, montoTotal, cuota,
        saldoPendiente: montoTotal,
        ultimoPagoFecha: "",
        lat: coordTemp.lat,
        lng: coordTemp.lng
      };

      await addDoc(collection(db, "prestamos"), cliente);
      cerrarModal();
      location.reload();
    };

    // Cargar préstamos
    async function cargarPrestamos() {
      const querySnapshot = await getDocs(collection(db, "prestamos"));
      let acumuladoHoy = 0;

      querySnapshot.forEach((docSnap) => {
        const c = docSnap.data();
        const id = docSnap.id;
        const realizoPagoHoy = c.ultimoPagoFecha === todayStr;

        if (realizoPagoHoy) acumuladoHoy += c.cuota;

        const color = realizoPagoHoy ? 'green' : (c.saldoPendiente <= 0 ? 'blue' : 'red');

        const marker = L.circleMarker([c.lat, c.lng], {
          radius: 10,
          fillColor: color,
          color: "#000",
          weight: 1,
          fillOpacity: 0.8
        }).addTo(map);

        const popup = `
          <b>${c.nombre}</b><br>
          Saldo: <b>$${c.saldoPendiente}</b><br>
          Cuota diaria: $${c.cuota}<br><br>
          ${!realizoPagoHoy && c.saldoPendiente > 0 ? 
            `<button onclick="cobrarCuota('${id}', ${c.saldoPendiente}, ${c.cuota})" style="background:#27ae60;color:white;border:none;padding:6px;width:100%;border-radius:4px;">💵 Cobrar Cuota ($${c.cuota})</button>` : 
            `<b style="color:green;">✓ Al día hoy</b>`}
          <br><br>
          <a href="https://wa.me/${c.telefono}?text=Hola%20${encodeURIComponent(c.nombre)},%20confirmamos%20tu%20pago.%20Saldo%20pendiente:%20$${c.saldoPendiente - c.cuota}" target="_blank" style="text-decoration:none;">📲 Enviar Recibo</a>
        `;
        marker.bindPopup(popup);
      });

      document.getElementById('totalCobrado').innerText = `$${acumuladoHoy}`;
    }

    // Registrar Cobro
    window.cobrarCuota = async (id, saldoActual, cuota) => {
      const nuevoSaldo = Math.max(0, saldoActual - cuota);
      const clienteRef = doc(db, "prestamos", id);

      await updateDoc(clienteRef, {
        saldoPendiente: nuevoSaldo,
        ultimoPagoFecha: todayStr
      });

      alert("¡Pago registrado exitosamente!");
      location.reload();
    };

    cargarPrestamos();
  </script>
</body>
</html>
